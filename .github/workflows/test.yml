name: Lint & Test and Deploy
on: [push, workflow_dispatch]
jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: get code
              uses: actions/checkout@v7
            - name: Install dependencies
              run: npm ci
            - name: Lint code ( check for vulnerabilities)
              run: npm run lint
            - name: Test code
              run: npm run test
    build:
        needs: test
        runs-on: ubuntu-latest
        steps:
             - name: Get Code
               uses: actions/checkout@v7
             - name: Install Dependencies
               run: npm ci
             - name: Build Project
               run: npm run build
             - name: upload Artifacts
               uses: actions/upload-artifacts@v4
               with: 
                name: dist-filed
                path: |
                  dist
                  index.html

    deploy:
        needs: build 
        runs-on: ubuntu-latest
        steps:
             - name: Deploy
               run: echo "Deploying....." 
