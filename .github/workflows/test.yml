name: Lint & Test and Deploy
on: [push, workflow_dispatch]
jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: get code
              uses: actions/checkout@v7
            - name: Cache Dependencies
              uses: actions/cache@v4
              with: 
                path: ~/.npm
                key: cached-node-mdules-${{ hashFiles('**/package-lock.json') }}
            - name: Install dependencies
              run: npm ci
            - name: Test code
              id: run-tests
              run: npm run test
            - name: Upload Test Report
              if: failure() && steps.run-tests.outcome == 'failure'
              uses: actions/upload-artifact@v4
              with:
                name: test-report
                path: test.json
    lint:
      runs-on: ubuntu-latest
      steps:
            - name: get code
              uses: actions/checkout@v7
            - name: Cache Dependencies
              uses: actions/cache@v4
              with: 
                path: ~/.npm
                key: cached-node-mdules-${{ hashFiles('**/package-lock.json') }}
            - name: Install dependencies
              run: npm ci
            - name: Lint code ( check for vulnerabilities)
              run: npm run lint
    build:
        needs: test
        runs-on: ubuntu-latest
        outputs:
          script-file: ${{steps.publish.outputs.script-filename}}
        steps:
             - name: Get Code
               uses: actions/checkout@v7
             - name: Cache Dependencies
               uses: actions/cache@v4
               with: 
                path: ~/.npm
                key: cached-node-mdules-${{ hashFiles('**/package-lock.json') }}
             - name: Install Dependencies
               run: npm ci
             - name: Build Project
               run: npm run build
             - name: Publish JS file name
               id: publish
               run: find dist/assets/*.js -type f -execdir echo 'script-filename={}' >> $GITHUB_OUTPUT ';'
             - name: upload Artifacts
               uses: actions/upload-artifact@v4
               with: 
                name: dist-files
                path: |
                  dist
                  index.html

    deploy:
        needs: build 
        runs-on: ubuntu-latest
        steps:
             - name: Get Build Artifacts
               uses : actions/download-artifact@v4
               with:
                name: dist-files
             - name: output content
               run: ls
             - name: Output filename
               run: echo "${{ needs.build.outputs.script-file }}"
             - name: Deploy
               run: echo "Deploying....." 
    report:
        needs: [lint,deploy]
        if: failure()
        runs-on: ubuntu-latest
        steps:
              - name: Output Information
                run: |
                  echo "Something went wrong"
                  echo "${{ toJson(github) }}"
       
