name: Lint & Test and Deploy
on: push
jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: get code
              uses: actions/checkout@v7
            - name: Install dependencies
              run: npm ci
            - name: Lint code ( check for vulnerabilities)
              run: npm run lint
            - name: Test code
              run: npm run test
    build:
        needs: test
        runs-on: ubuntu-latest
        steps:
             - name: Get Code
               uses: actions/checkout@v7
             #- name: Install Node Js
             #  uses: actions/setup-node@v7
              # with:
               #  node-version: 24
             - name: Install Dependencies
               run: npm ci
             - name: Build Project
               run: npm run build
    deploy:
        needs: build 
        runs-on: ubuntu-latest
        steps:
             - name: Deploy
               run: echo "Deploying....." 
